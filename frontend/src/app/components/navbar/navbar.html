    <header>
        <nav class="navbar">
            <div class="logo">Ultras</div>

            <ul class="nav-links">
                <li><a routerLink="home" routerLinkActive="link-active">Home</a></li>
                <li><a routerLink="products" routerLinkActive="link-active">Products</a></li>
                <li><a routerLink="about" routerLinkActive="link-active">About</a></li>
                <li><a routerLink="contact" routerLinkActive="link-active">Contact</a></li>
            </ul>

            <ul class="nav-actions">
                
                @if(isLoggedIn){
                    <li><a routerLink="cart" routerLinkActive="link-active" [routerLinkActiveOptions]="{exact: true}">
                            <i class="fa-solid fa-bag-shopping fa-xl"></i>
                            @if (cartCount() > 0) {
                                <span class="cart-badge">{{ cartCount() }}</span>
                            }
                        </a>
                    </li>
                    <li><a id="logOut" (click)="logOut()" routerLinkActive="link-active" [routerLinkActiveOptions]="{exact: true}">Log Out</a></li>
                }@else{
                    <li><a routerLink="login" routerLinkActive="link-active" [routerLinkActiveOptions]="{exact: true}">Login</a></li>
                    <li><a routerLink="register" routerLinkActive="link-active" [routerLinkActiveOptions]="{exact: true}">Register</a></li>
                }
            </ul>

        </nav>
    </header>
